name: ci

# Quality gates on every push and pull request, and reused by the release
# workflow (`workflow_call`) so a tag can never publish a build that would not
# have passed CI. Before this existed, the first compile of any change happened
# when a `v*` tag was pushed — i.e. a broken build broke a *release*.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# Least privilege by default. Without this the GITHUB_TOKEN inherits the
# repository default (often read/write) on every push and pull request, and
# `actions/checkout` persists it into .git/config for every later step —
# including `npm ci` and the PowerShell fetch script.
permissions:
  contents: read

# One run per ref: a second push supersedes the first instead of racing it for
# the shared caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA, not by tag: a tag is mutable, and these
# actions run in the same workflow chain as the release signing secrets.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src-tauri/sidecar/cputemp/packages.lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm run test

      # The SPDX headers and THIRD-PARTY-NOTICES.txt are what keeps the GPL and
      # the licenses of the bundled code satisfied, so a stale file fails here.
      - name: Licensing (SPDX headers and third-party notices)
        run: npm run check:legal

      - name: Build frontend
        run: npm run build

      # tauri.conf.json declares these as bundle resources, so cargo cannot even
      # check the crate without them. PresentMon is SHA-256 verified in here.
      - name: Fetch bundled binaries (PresentMon + cputemp sidecar)
        run: pwsh scripts/fetch-binaries.ps1

      # Sensor selection logic only; opening the kernel driver is not possible here.
      - name: cputemp sidecar self-test
        run: ./src-tauri/binaries/cputemp.exe --self-test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # The installer itself. Everything above stops at `cargo test`, so the NSIS
  # script, the install hooks, the bundled resources and the updater artifacts
  # used to be produced for the very first time by the tag build — exactly the
  # failure mode this workflow's header says was removed. Pull requests skip it
  # (a full release build with fat LTO is minutes); master and the release
  # chain run it.
  bundle:
    # master only. Pull requests skip it (minutes of fat LTO for every review),
    # and on `deploy` the release workflow builds the real bundle itself with the
    # signing secrets — running it here too would double the minutes for an
    # artifact that gets thrown away.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src-tauri/sidecar/cputemp/packages.lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Fetch bundled binaries (PresentMon + cputemp sidecar)
        run: pwsh scripts/fetch-binaries.ps1

      # No signing secrets here: this job proves the installer builds, nothing
      # more. `createUpdaterArtifacts` is switched off for it, because producing
      # an updater artifact requires TAURI_SIGNING_PRIVATE_KEY and `tauri build`
      # exits non-zero without it — the config has a public key, so it expects to
      # sign. The real updater artifact is built and signed by the release
      # workflow, which does have the key.
      - name: Build installer
        shell: bash
        run: npm run app:build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

  # Dependency advisories. Separate job so a new advisory in a build-time
  # dependency reports on its own instead of hiding inside the gate output.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      # The gate covers what ships: only production dependencies end up in the
      # exported bundle. Build-time tooling is audited too, but as a report,
      # so an advisory in a dev-only package cannot block a release on its own.
      - name: npm audit (shipped dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (build-time dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=high
