name: release

# Build, sign and publish a Windows release when something lands on `deploy`.
#
# The flow is: work on master → merge master into deploy → this runs. The version
# comes from the tree (all five files must already agree), and the tag `vX.Y.Z` is
# created by tauri-action, not by hand. tauri-action creates the GitHub Release and
# uploads `latest.json`, which the in-app updater reads from the
# "releases/latest/download/latest.json" endpoint.
#
# READ THIS BEFORE MERGING: there is no draft step. A merge into `deploy` publishes
# to every existing installation, which auto-updates within minutes. Merge when you
# mean to ship, not to "save progress".
on:
  push:
    branches: [deploy]
  # Manual re-run, for when a publish failed after the gates passed (a flaky
  # upload, an expired secret) and nothing in the tree needs to change.
  workflow_dispatch:

# Read-only by default; only the release job is granted write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same gates as every PR (typecheck, build, clippy -D warnings, cargo test).
  # A tag that would not pass CI never reaches the release job.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # A manual run is only a re-run of a publish, so it must sit on the
      # same ref a push would: anything else would publish an unmerged tree.
      - name: Refuse to publish from a ref other than deploy
        if: github.ref != 'refs/heads/deploy'
        shell: pwsh
        run: |
          Write-Error "Releases are published from the deploy branch only (got '${{ github.ref }}')."
          exit 1

      # Actions pinned by commit SHA: these steps see the updater signing key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Deliberately NOT cached. This job holds TAURI_SIGNING_PRIVATE_KEY, and a
      # cargo cache is written by every push to master: restoring it here would
      # link whatever is in someone else's `target/` into the signed binary that
      # auto-updates every user within minutes. A release is worth a cold build.

      - name: Install frontend deps
        run: npm ci

      # --- Metrics binaries bundled as resources (see tauri.conf.json) ---------
      # PresentMon (FPS with admin) and the cputemp sidecar (CPU temp, AMD GPU
      # metrics and FPS) are produced into src-tauri/binaries/ by the shared
      # script, which verifies PresentMon's SHA-256 before it is bundled.
      #
      # Note the installer is NOT Authenticode-signed. Only the updater artifact
      # is signed, with minisign, which protects an update in flight but does
      # nothing for the first install: users get SmartScreen's "unknown
      # publisher" every time.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src-tauri/sidecar/cputemp/packages.lock.json

      - name: Fetch bundled binaries (PresentMon + cputemp sidecar)
        run: pwsh scripts/fetch-binaries.ps1

      # The version now comes from the tree, so the tree has to be self-consistent.
      # tauri-action takes the artifact version — and the `latest.json` the updater
      # reads — from tauri.conf.json, while package.json and the two lockfiles feed
      # everything else. One file left behind and the release announces a version
      # that does not match what it installs, with no error anywhere.
      #
      # It also refuses to publish a version that already has a tag: merging into
      # `deploy` without bumping first would otherwise try to re-release the same
      # version over the previous one. The updater never moves sideways, so that
      # publish would reach nobody while looking like a success.
      - name: Resolve and verify the version
        id: version
        shell: pwsh
        run: |
          $conf     = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg      = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # npm's lockfile keys the root package as `packages[""]`; pwsh 7's
          # ConvertFrom-Json refuses an empty property name unless it builds a
          # hashtable instead of a PSCustomObject.
          $lock     = (Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable)
          $lockTop  = $lock['version']
          $lockSelf = $lock['packages']['']['version']
          $cargo    = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                       Select-Object -First 1).Matches[0].Groups[1].Value
          $lockRs   = (Get-Content src-tauri/Cargo.lock -Raw |
                       Select-String -Pattern 'name = "astrail"\r?\nversion = "([^"]+)"').Matches[0].Groups[1].Value

          Write-Host "tauri.conf.json=$conf package.json=$pkg package-lock(top)=$lockTop package-lock(self)=$lockSelf Cargo.toml=$cargo Cargo.lock=$lockRs"
          $all = @($pkg, $lockTop, $lockSelf, $cargo, $lockRs)
          if ($all | Where-Object { $_ -ne $conf }) {
            throw "Version mismatch across the five files. tauri.conf.json says $conf. Bump every file (see the release skill) before merging into deploy."
          }
          if ($conf -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$conf' is not a plain X.Y.Z semver."
          }

          # A tag for this version already exists → the merge did not bump.
          $existing = git ls-remote --tags origin "refs/tags/v$conf"
          if ($existing) {
            throw "v$conf is already released. Bump the version on master and merge again; re-publishing the same version reaches nobody, because the updater never moves sideways."
          }

          "version=$conf" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing v$conf"

      # An unset repository secret expands to an empty string, and a build
      # without IGDB credentials does not fail: it ships with cover lookups
      # disabled. Every installation auto-updates, so catch it here instead.
      - name: Require the build-time secrets
        shell: pwsh
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $missing = @('IGDB_CLIENT_ID', 'IGDB_CLIENT_SECRET', 'TAURI_SIGNING_PRIVATE_KEY') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Missing repository secrets: $($missing -join ', '). Add them under Settings > Secrets and variables > Actions."
          }

      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generate the keypair once with `npm run tauri signer generate` and
          # store these as repository secrets. The public key goes in
          # tauri.conf.json → plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # IGDB cover lookups. Build-time only (see src-tauri/src/igdb.rs): a
          # build without them ships with cover resolution disabled instead of
          # embedding a shared credential in every user's binary.
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          # Settings → About says "unofficial build" unless this is set, which
          # only happens here, in the upstream repository. A fork that runs the
          # same workflow gets the warning without having to remember anything —
          # term 2 of ADDITIONAL-TERMS.md (GPL section 7c).
          ASTRAIL_OFFICIAL_BUILD: ${{ github.repository == 'MrRobot4042212/Astrail' && '1' || '' }}
        with:
          # tauri-action substitutes __VERSION__ with the app version and creates
          # the tag itself, so the tag can never disagree with what was built.
          tagName: v__VERSION__
          releaseName: 'Astrail v__VERSION__'
          releaseBody: 'See CHANGELOG.md for what changed in this version.'
          releaseDraft: false
          prerelease: false
