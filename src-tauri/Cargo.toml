[package]
name = "meteor"
version = "0.1.2"
description = "Meteor - biblioteca unificada de juegos y apps"
authors = ["Alfonso"]
edition = "2021"
rust-version = "1.77.2"

# The library is what main.rs calls into. Only `rlib` is needed: `staticlib` and
# `cdylib` are the iOS/Android entry points, and building them made cargo link
# the crate three times — with fat LTO and codegen-units=1, linking is the
# dominant cost of a release build of a Windows-only app.
[lib]
name = "meteor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the C++ ADLX shim (AMD GPU telemetry) on Windows. See build.rs.
[target.'cfg(windows)'.build-dependencies]
cc = "1"
# Embeds the SHA-256 of the bundled sidecars (see build.rs, sidecar_integrity.rs).
sha2 = "0.10"

[dependencies]
# No `image-png`/`image-ico`: tauri-codegen decodes `icons/icon.ico` to raw RGBA
# at build time (see tauri-codegen `CachedIcon::new_ico`), so nothing decodes an
# image at runtime. The feature pulled in the `image` crate plus a second copy of
# `png` for no reason.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# Verifies the elevated sidecars before they are started (sidecar_integrity.rs).
# Already in the dependency graph through tauri.
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Launch Meteor on Windows login so the playtime/Discord watcher runs in the
# background without the user opening the window first.
tauri-plugin-autostart = "2"
# In-app auto-update: check GitHub Releases for a newer signed build, download
# and install it, then relaunch (process plugin) — no manual reinstall.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1"
ureq = { version = "2", features = ["json", "tls"] }
# Discord Rich Presence over the local IPC pipe (pure Rust, no Discord SDK).
discord-rich-presence = "0.2"
# NVIDIA GPU telemetry for the in-game metrics overlay (usage, temp, VRAM,
# clocks, power). Loads nvml.dll at runtime; on non-NVIDIA systems init fails
# gracefully and the overlay just omits GPU metrics. CPU/RAM come from Win32.
nvml-wrapper = "0.10"

# Registry-backed scanners (GOG, EA, Ubisoft) are Windows-only.
[target.'cfg(windows)'.dependencies]
# Same version Tauri's runtime already links, so no duplicate crate. Used to tell
# WebView2 to release memory while Meteor sits in the tray (see lib.rs).
webview2-com = "0.38"
# Deliberately NOT bumped to 0.56 (which Tauri itself pulls, so `cargo tree -d`
# reports duplicates): 0.56 changes `HKEY` from `isize` to `*mut c_void`, which
# would churn every registry scanner for a build-graph cleanup with no runtime
# effect. Revisit when a scanner needs touching anyway.
winreg = "0.52"
# Pure-Rust PE reader to extract the icon embedded in an app's .exe, so any
# installed app gets its correct icon without a curated list or native libs.
pelite = "0.10"
# Raw Win32 to force the metrics overlay back to the top of the topmost z-order
# band each tick (Tauri's set_always_on_top is a no-op once already topmost).
# Same version Tauri itself uses, so no extra build cost.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    # Detect process elevation and relaunch elevated ("Restart as admin") for the
    # admin-only metrics (CPU temp, NVIDIA FPS via PresentMon).
    "Win32_Security",
    # Resolve the user's display/full name for the Home greeting (GetUserNameExW).
    "Win32_Security_Authentication_Identity",
    "Win32_System_Threading",
    # Kill-on-close Job Object for the metrics sidecars (see jobobj.rs), so an
    # elevated PresentMon/cputemp can never outlive Meteor.
    "Win32_System_JobObjects",
    # Stop PresentMon's ETW realtime session by name (ControlTraceW). The session is
    # a kernel object that outlives the process that created it, so terminating
    # PresentMon is not enough to release it — see presentmon.rs.
    "Win32_System_Diagnostics_Etw",
    # Cheap global CPU%/RAM for the metrics sampler (GetSystemTimes /
    # GlobalMemoryStatusEx) plus the CPU/RAM description for the system panel.
    "Win32_System_SystemInformation",
    # Process enumeration for the playtime watcher and drive/volume info for the
    # "Mi equipo" panel — both used to come from the `sysinfo` crate.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    # Native layered HUD window (lightweight overlay): module handle for the window class.
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    # Launching games through the desktop Explorer when Meteor is elevated, so they
    # get the user's normal token (launcher.rs `desktop_shell`).
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # Per-monitor DPI for the HUD (GetDpiForMonitor), read on the sampler thread
    # instead of hopping to the main thread for primary_monitor().
    "Win32_UI_HiDpi",
    # MPO-friendly HUD: DirectComposition + DXGI flip swapchain + Direct2D/DirectWrite,
    # so DWM can promote the overlay to a hardware plane and the game keeps independent
    # flip (no composition / input lag). Falls back to the GDI layered window.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Foundation_Numerics",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dependencies are compiled once and then run for the whole dev session, so
# optimizing them costs nothing per iteration and makes `tauri dev` usable: the
# metrics sampler, PE icon parsing and JSON work are all in dependency code.
[profile.dev.package."*"]
opt-level = 2
