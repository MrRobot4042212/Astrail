# Local builds, CI and releases all track the current stable channel with the
# same components and target. The oldest compiler the crate promises to build
# with is `rust-version` in Cargo.toml (verified against `cargo metadata`: the
# highest `rust_version` in the dependency graph); bump that when a dependency
# or a language feature requires it, not with every stable release.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc"]
